- conBadges:
    Control: GroupContainer@1.3.0
    Variant: ManualLayout
    Properties:
      X: =24
      Y: =24
      Width: =700
      Height: =32
      Fill: =RGBA(0, 0, 0, 0)
      Visible: =true
    Children:
      - htmlBadgeAprovado:
          Control: HtmlViewer@2.1.0
          Properties:
            HtmlText: |-
              =With(
                  {s: "Aprovado"},
                  With(
                      {
                          c: Switch(s, "Aprovado", "16,185,129", "Pendente", "245,158,11", "Atrasado", "239,68,68", "Em andamento", "124,58,237", "107,114,128"),
                          t: Switch(s, "Aprovado", "#047857", "Pendente", "#B45309", "Atrasado", "#B91C1C", "Em andamento", "#6D28D9", "#4B5563")
                      },
                      "<div style='display:inline-block; padding:5px 12px 5px 10px; border-radius:999px; background:rgba(" & c & ",0.12); border:1px solid rgba(" & c & ",0.25); color:" & t & "; font:600 12px Segoe UI,Open Sans,sans-serif; white-space:nowrap;'><span style='display:inline-block; width:7px; height:7px; border-radius:50%; background:rgb(" & c & "); margin-right:7px; vertical-align:middle;'></span><span style='vertical-align:middle;'>" & s & "</span></div>"
                  )
              )
            X: =0
            Y: =0
            Width: =136
            Height: =32
            PaddingTop: =0
            PaddingBottom: =0
            PaddingLeft: =0
            PaddingRight: =0
